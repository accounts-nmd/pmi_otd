<style>
/* Layout: white app bar with blue underline tabs, quiet filter strip, open white canvas; tiles → charts → tables. Single light theme by choice. */
:root{
  color-scheme:light;
  --accent:#1f62c4; --accent-2:#2a78d6; --accent-bg:#eef4fd; --accent-line:#cfe0f7;
  --bg:#ffffff; --strip:#f7f9fc; --panel:#ffffff; --ink:#0f1a2b; --ink-2:#47536a; --ink-3:#7c879b;
  --line:#e4e9f0; --line-2:#eff2f7; --hover:#f5f8fd;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --tgt:#0f1a2b;
  --good:#15804a; --good-bg:#e4f5eb; --warn:#9a6200; --warn-bg:#fcf1dc; --bad:#c03636; --bad-bg:#fce8e8;
  --heat:42,120,214;
  --f-display:"Sora","Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mast{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px 6px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.03em;flex:none}
.brandlogo{height:40px;width:auto;flex:none;display:block}
.mast .wrap>div:not(.right){padding-left:14px;border-left:1px solid var(--line)}
.mast h1{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.mast .sub{color:var(--ink-3);font-size:12px;letter-spacing:.02em}
.mast .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.mast .pill{background:var(--strip);border-color:var(--line);color:var(--ink-2)}
.mast .pill.live{color:var(--good);background:var(--good-bg);border-color:transparent}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--ink-2);font:600 13.5px var(--f-body);padding:10px 12px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--strip);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding-block:10px}
.fld{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:600}
select,input[type=search],input[type=number],input[type=text],input[type=date]{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
select:hover,input:hover{border-color:var(--accent-line)}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.seg button{border:0;background:none;font:600 12.5px var(--f-body);color:var(--ink-2);padding:5px 11px;border-radius:7px;cursor:pointer}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent)}
.asof{margin-left:auto;font-size:12px;color:var(--ink-3)}
main{padding-block:22px 56px}
.view{display:grid;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:grid;gap:4px;align-content:start}
.tile .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .val{font-family:var(--f-display);font-size:25px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .val small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.tile .foot{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tile.hero{background:var(--accent-bg);border-color:var(--accent-line)}
.tile.hero .lbl{color:var(--accent)} .tile.hero .val{color:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent-2)}
.tile.hero .meter{background:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.chip.up{color:var(--good);background:var(--good-bg)} .chip.dn{color:var(--bad);background:var(--bad-bg)} .chip.mid{color:var(--warn);background:var(--warn-bg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.grid2,.grid32{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.card .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card .hd .note{font-size:12px;color:var(--ink-3)}
.card .hd .sp{margin-left:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;width:16px;border-radius:0}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--tgt);background:none}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--ink-3);font:11px var(--f-body);font-variant-numeric:tabular-nums}
svg.chart .grid{stroke:var(--line-2);stroke-width:1}
svg.chart .axis{stroke:var(--line);stroke-width:1}
svg.chart .lab{fill:var(--ink-2);font-weight:600;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-width:150px;max-width:280px}
.tip b{display:block;font-size:12.5px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--strip);color:var(--ink-3);font-weight:600;position:sticky;top:0}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)}
th.n,td.n{text-align:right}
tbody tr:hover{background:var(--hover)}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
td.wrap-t{white-space:normal;min-width:220px}
td .bar{display:inline-block;height:8px;border-radius:2px;background:var(--s1);vertical-align:middle;margin-right:8px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-size:12px}
.click{cursor:pointer}
.btn{font:600 13px var(--f-body);border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.gold{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{border-radius:8px;padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
.msg.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.msg.info{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-bg)}
.tgt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tgt-grid label{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600}
.tgt-grid input{width:100%}
.heat td.n{font-size:12.5px}
.more{display:flex;justify-content:center;padding:10px}
.lines td{background:var(--line-2);font-size:12.5px}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);margin-top:6px}
.sec-hd h2{margin:2px 0 0;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.eyebrow{font-size:12px;font-weight:600;color:var(--accent)}
.mseg{flex-wrap:wrap}
.mseg button{min-width:42px}
.seg button:disabled{color:var(--ink-3);opacity:.45;cursor:not-allowed;background:none}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
@media (max-width:560px){.tile .val{font-size:22px}.asof{margin-left:0;width:100%}.mast h1{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

/* roles + sign-in cover */
.pill.role{background:var(--strip);border-color:var(--line);color:var(--ink-2)}
.pill.role.adm{background:var(--accent);border-color:var(--accent);color:#fff}
body.signed-out .filters,body.signed-out .tabs,body.signed-out #srcPill{display:none}
body.signed-out{background:var(--strip)}
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);max-width:980px;margin:clamp(8px,4vh,40px) auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 20px 60px rgba(15,26,43,.10)}
.cover-l{position:relative;padding:36px 36px 30px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(160deg,#1f62c4 0%,#174c9c 100%);color:#fff;overflow:hidden}
.cover-l::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(180deg,#000,transparent 90%)}
.cover-l>*{position:relative;z-index:1}
.cover-logo{align-self:flex-start;background:#fff;border-radius:10px;padding:8px 12px;height:58px;width:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cover-eyebrow{margin-top:10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#cfe0f7}
.cover h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.02;letter-spacing:-.02em;color:#fff}
.cover-sub{margin:0;color:#dbe7f8;max-width:42ch}
.cover-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:auto 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.cover-meta dt{font-size:11px;color:#cfe0f7}.cover-meta dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.cover-r{display:flex;align-items:center;justify-content:center;padding:36px 30px}
.signin{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.signin .lock{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);border-radius:99px;padding:3px 10px}
.signin h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.01em}
.whos{display:grid;gap:10px}
.who{display:grid;grid-template-columns:46px 1fr 18px;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.who:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 22px rgba(31,98,196,.12)}
.who:disabled{opacity:.5;cursor:not-allowed;transform:none}
.who .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff}
.who.adm .ic{background:linear-gradient(135deg,#e0262d,#a3141a)} .who.vw .ic{background:linear-gradient(135deg,#2a78d6,#174c9c)}
.who .ic svg{width:24px;height:24px}
.who b{display:block;font-size:16px}.who small{display:block;font-size:12.5px;color:var(--ink-3)}
.who .arr{color:var(--ink-3);font-size:20px}
.who-sub{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 0 58px}
.who-sub button{border-radius:99px;padding:5px 12px;font:600 12.5px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.as{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line)}
.as .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.as .av.adm{background:linear-gradient(135deg,#e0262d,#a3141a)}.as .av.vw{background:linear-gradient(135deg,#2a78d6,#174c9c)}
.as div{display:flex;flex-direction:column;margin-right:auto;min-width:0}.as small{color:var(--ink-3);font-size:12px}
.as button{background:none;border:0;color:var(--accent);font:600 12.5px var(--f-body);cursor:pointer;text-decoration:underline}
.signin label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.signin input[type=password]{font-size:16px;padding:10px 12px;border-radius:10px}
.btn.big{padding:11px;font-size:15px;border-radius:10px}
.subh{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.adduser{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;align-items:end}
.adduser label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}

@media (max-width:760px){.cover{grid-template-columns:1fr}.cover-r{order:-1}.cover-l{padding:24px 22px}.cover-meta{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.cover{animation:fade .45s ease-out}}

/* ===== PMI theme: graphite press-shop shell, steel data, PMI red as the mark to hit ===== */
:root{
  --accent:#1f4e79; --accent-2:#2a6299; --accent-bg:#e7eef6; --accent-line:#c3d3e4;
  --brand:#d8231b; --brand-bg:#fbe8e7;
  --bg:#eceff3; --strip:#ffffff; --panel:#ffffff; --ink:#151b26; --ink-2:#465165; --ink-3:#727e91;
  --line:#d8dee6; --line-2:#e8ecf1; --hover:#f3f6f9;
  --s1:#1f4e79; --s2:#a9b5c3; --s3:#5f7f9e; --s4:#d0a43b; --tgt:#d8231b;
  --good:#13784a; --good-bg:#e2f3e9; --warn:#875800; --warn-bg:#fbefd6; --bad:#b4231c; --bad-bg:#fbe6e4;
  --graphite:#1b2330; --graphite-2:#222c3b;
  --hatch:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 10px);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{background:var(--bg);font-stretch:100%}
body::before{background:var(--graphite)}
/* header */
.mast{background:var(--graphite) var(--hatch);color:#fff;border-bottom:0}
.mast .wrap:first-child{padding-block:14px 10px}
.brandlogo{background:#fff;border-radius:6px;padding:5px 10px;height:44px}
.mast .wrap>div:not(.right){border-left-color:rgba(255,255,255,.16)}
.mast .sub{color:#97a3b6;font-size:12.5px;letter-spacing:0}
.mast h1{color:#fff;font-stretch:120%;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.mast .pill{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#d3dae4}
.mast .pill.live{background:rgba(60,207,142,.14);color:#86e3b6;border-color:transparent}
.mast .pill.role{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#d3dae4}
.mast .pill.role.adm{background:var(--brand);border-color:var(--brand);color:#fff}
.mast .btn{background:transparent;color:#e6ebf1;border-color:rgba(255,255,255,.25)}
.mast .btn:hover{border-color:#fff}
.mast .seg{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:2px}
.mast .seg button{color:#c3ccd8;border-radius:5px}
.mast .seg button:hover{background:rgba(255,255,255,.08)}
.mast .seg button[aria-pressed="true"]{background:#fff;color:var(--graphite);box-shadow:none}
.tabs{gap:2px;padding:0}
.tabs button{color:#aab5c4;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:11px 15px 12px;margin:0;font:600 14px var(--f-body);font-stretch:108%}
.tabs button:hover{color:#fff;background:none}
.tabs button[aria-selected="true"]{color:#fff;background:none;border-bottom-color:var(--brand);box-shadow:none}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:-3px}
/* filter strip */
.filters{background:#fff;border-bottom:1px solid var(--line);padding-top:0}
.filters .wrap{padding-block:10px}
.seg{background:var(--line-2);border:0;border-radius:7px;padding:2px}
.seg button{border-radius:5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--graphite);color:#fff;box-shadow:none}
select,input[type=search],input[type=number],input[type=text],input[type=date]{border-radius:6px;border-color:var(--line)}
.fld{color:var(--ink-2)}
/* tiles */
.tiles{gap:12px}
.tile{border-radius:8px;border:1px solid var(--line);box-shadow:none;padding:16px 18px;position:relative;overflow:hidden}
.tile .tic{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;margin-bottom:6px;background:var(--line-2);color:var(--ink-2)}
.tile .tic svg{width:17px;height:17px}
.tile[data-ic="target"] .tic{background:var(--brand-bg);color:var(--brand)}
.tile .lbl{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.tile .val{font-family:var(--f-display);font-stretch:112%;font-size:28px;font-weight:700;letter-spacing:-.015em}
.tile.hero{grid-column:span 2;background:var(--graphite) var(--hatch);border-color:var(--graphite);color:#fff;box-shadow:none}
.tile.hero::before,.tile.hero::after{content:none}
.tile.hero .lbl{color:#a9b4c4;opacity:1}
.tile.hero .val{color:#fff;font-size:46px;font-stretch:118%;font-weight:800}
.tile.hero .val small{color:#a9b4c4}
.tile.hero .foot{color:#d3dae4;opacity:1}
.tile.hero .tic{background:rgba(255,255,255,.08);color:#fff}
.tile.hero .meter{background:rgba(255,255,255,.14);height:6px}
.tile.hero .meter i{background:var(--brand)}
.tile.hero .chip.up{background:rgba(60,207,142,.18);color:#9ff0c6}.tile.hero .chip.dn{background:rgba(216,35,27,.3);color:#ffd2cf}.tile.hero .chip.mid{background:rgba(255,209,102,.18);color:#ffe3a3}
.meter{height:6px;border-radius:3px}.meter i{border-radius:3px;background:var(--accent)}
@media (max-width:560px){.tile.hero{grid-column:auto}.tile.hero .val{font-size:34px}}
body.u-act .tile .val{font-size:22px}body.u-act .tile.hero .val{font-size:32px}
/* cards, sections, tables */
.card{border-radius:8px;box-shadow:none;padding:20px;border-color:var(--line)}
.card h2{font-stretch:112%;font-size:16px;font-weight:700}
.card .hd{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line-2)}
.sec-hd{border-top:1px solid var(--line);padding-top:22px;margin-top:8px}
.sec-hd h2{font-size:26px;font-stretch:118%;font-weight:800;letter-spacing:-.015em}
.eyebrow{display:inline-block;background:none;padding:0;color:var(--brand);font-size:13px;font-weight:700;letter-spacing:0}
.tbl-wrap{border-radius:6px}
th{background:#f3f5f8;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink-2)}
td .bar{height:8px;border-radius:2px;background:var(--accent)}
.chip{border-radius:4px;padding:1px 7px}
.btn{border-radius:6px}
.btn.pri,.btn.gold{background:var(--graphite);border-color:var(--graphite);color:#fff;box-shadow:none}
.btn.pri:hover{background:#0f141d}
.mseg button[aria-pressed="true"]{background:var(--graphite);color:#fff}
.legend i{border-radius:2px}
svg.chart .grid{stroke:#e4e8ee;stroke-dasharray:none}
@media (prefers-reduced-motion:no-preference){
  svg.chart path[fill]:not([fill="transparent"]){transform-box:fill-box;transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.7,.2,1) both}
  svg.chart polyline{stroke-dasharray:3000;animation:draw 1.2s ease-out both}
}
@media (max-width:760px){.filters{position:static}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:3000}to{stroke-dashoffset:0}}

/* ===== front page (sign-in) ===== */
body.signed-out .mast{display:none}
body.signed-out,body.signed-out::before{background:var(--graphite)}
body.signed-out main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-block:24px;position:relative}
body.signed-out .empty{color:#c3ccd8}
body.signed-out .empty img{background:#fff;border-radius:6px;padding:8px 12px;box-sizing:content-box}
.cv-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--graphite) var(--hatch);overflow:hidden}
.cv-bg::after{content:"";position:absolute;left:-10%;right:-10%;bottom:14%;height:5px;background:var(--brand);transform:rotate(-8deg);opacity:.9}
.cv-bg i{display:none}
.cover{position:relative;z-index:1;max-width:1080px;width:100%;margin:clamp(8px,3vh,32px) auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-radius:10px;overflow:hidden;background:#fff;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:none}
.cover-l{background:var(--graphite-2) var(--hatch);color:#fff;padding:36px 40px 30px;display:flex;flex-direction:column;gap:18px}
.cover-l::after{display:none}
.cv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cover-logo{background:#fff;border-radius:6px;padding:8px 12px;height:56px;width:auto;box-shadow:none;align-self:auto}
.cv-live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#cfd7e2;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:5px 11px;background:transparent}
.cv-live i{width:8px;height:8px;border-radius:50%;background:#3ccf8e}
.cover-eyebrow{margin-top:10px;color:#97a3b6;font-size:14px;font-weight:600;letter-spacing:0}
.cover h1{margin:0;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(46px,6.4vw,80px);line-height:.92;letter-spacing:-.025em;color:#fff}
.cover-sub{margin:0;color:#c3ccd8;max-width:40ch;font-size:15px}
.cv-chart{background:none;border:0;border-top:1px solid rgba(255,255,255,.14);border-radius:0;padding:16px 0 0}
.cv-chart svg{width:100%;height:auto;display:block}
.cv-chart .cb{fill:#dde3ec}
.cv-chart .cb.fut{fill:rgba(255,255,255,.08)}
.cv-chart .cb.now{fill:var(--brand)}
.cv-months{display:grid;grid-template-columns:repeat(12,1fr);font-size:11px;color:#8f9bad;text-align:center;padding:4px 0 0}
.cv-cap{font-size:12.5px;color:#97a3b6;margin:0 0 8px}
.cover-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:auto 0 0;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.cover-meta dt{font-size:12px;color:#8f9bad}.cover-meta dd{margin:2px 0 0;font-weight:600;color:#fff}
.cover-r{background:#fff;padding:44px 38px;display:flex;align-items:center;justify-content:center}
.signin .lock{align-self:flex-start;background:none;color:var(--brand);padding:0;border-radius:0;letter-spacing:0;text-transform:none;font-size:13.5px;font-weight:700}
.signin h2{font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:28px;letter-spacing:-.015em;margin:0}
.who{border-radius:8px;padding:15px;border:1px solid var(--line);transition:border-color .15s ease,background .15s ease}
.who:hover{transform:none;border-color:var(--graphite);background:var(--hover);box-shadow:none}
.who .ic{border-radius:8px}
.who.adm .ic{background:var(--brand)}.who.vw .ic{background:var(--graphite)}
.as{border-radius:8px}
.as .av.adm{background:var(--brand)}.as .av.vw{background:var(--graphite)}
.btn.big{background:var(--graphite);color:#fff;border:0;box-shadow:none;padding:12px;font-size:15px;border-radius:8px}
.btn.big:hover{background:#0f141d}
.cv-mlogo{display:none;height:40px;width:auto;align-self:flex-start}
body.signed-out .useg{display:none}
@media (max-width:760px){.cover{grid-template-columns:1fr}.cover-r{order:-1;padding:28px 22px}.cv-chart{display:none}.cover-l{padding:24px 22px}.cv-mlogo{display:block}}
@media (prefers-reduced-motion:no-preference){
  .cv-chart .cb{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
}
</style>

function applyDefaultTargets() { const D = window.PMI_DEFAULTS; TARGETS = JSON.parse(JSON.stringify(ABP)); FYS.forEach(f => { QTGT[f] = new Array(12).fill(null); if (D && D.targets && Array.isArray(D.targets[f])) TARGETS[f] = D.targets[f].slice(); if (D && D.qty && Array.isArray(D.qty[f])) QTGT[f] = D.qty[f].slice(); }); }
applyDefaultTargets();

let SAVED_UNIT = 'C'; try { SAVED_UNIT = ['L', 'C', 'A'].includes(localStorage.getItem('pmiSalesUnit')) ? localStorage.getItem('pmiSalesUnit') : 'C'; } catch (e) {}
const S = { unit: SAVED_UNIT, dr: null, dm: null, ms: { q: '', n: 200, sort: 't', dir: -1 }, fy: '2026-27', plant: PLANT, cc: 'All', core: true, view: 'dashboard',
  inv: { q: '', m: 'all', cust: 'all', n: 100, open: new Set() }, prod: { q: '', by: 'part', sort: 'amt', dir: -1, n: 150 }, cust: { q: '', sort: 'cur', dir: -1 } };
try { const v = JSON.parse(localStorage.getItem('pmiSalesUI') || '{}'); Object.assign(S, { fy: FYS.includes(v.fy) ? v.fy : S.fy, cc: v.cc || S.cc, core: v.excl === undefined ? true : !!v.excl }); } catch (e) {}
function saveUI() { try { localStorage.setItem('pmiSalesUI', JSON.stringify({ fy: S.fy, plant: S.plant, cc: S.cc, excl: S.core })); } catch (e) {} }

function filt(fy, opt = {}) {
  const D = DATA[fy]; if (!D) return [];
  const lim = opt.upto;
  return D.rows.filter(r => (S.plant === 'All' || r.plant === S.plant) && (opt.noCC || S.cc === 'All' || r.cc === S.cc) && (!S.core || !notSale(r)) && (lim == null || r.o <= lim));
}
const sum = rows => rows.reduce((a, r) => a + r.amt, 0);
function byMonth(rows) { const a = new Array(12).fill(0); for (const r of rows) a[r.m] += r.amt; return a; }
function groupSum(rows, key) { const m = new Map(); for (const r of rows) { const k = typeof key === 'function' ? key(r) : r[key]; m.set(k, (m.get(k) || 0) + r.amt); } return m; }
const prevFY = fy => FYS[FYS.indexOf(fy) + 1] || null;
const targetsOn = () => S.cc === 'All' && (S.plant === PLANT);
function tgt(fy) { const t = TARGETS[fy]; return targetsOn() && t && t.some(x => x) ? t : null; }
function qtgt(fy) { const t = QTGT[fy]; return targetsOn() && t && t.some(x => x) ? t : null; }
function qtPro(fy, m, frac) { const t = qtgt(fy); if (!t) return null; return t.slice(0, m).reduce((a, b) => a + (b || 0), 0) + (t[m] || 0) * frac; }
function daysIn(fy, m) { const y = +fy.slice(0, 4) + (m >= 9 ? 1 : 0), mo = (m + 3) % 12; return new Date(Date.UTC(y, mo + 1, 0)).getUTCDate(); }
function workDays(fy, m, fromDay, toDay) { const y = +fy.slice(0, 4) + (m >= 9 ? 1 : 0), mo = (m + 3) % 12; let n = 0; for (let d = fromDay; d <= toDay; d++) if (new Date(Date.UTC(y, mo, d)).getUTCDay() !== 0) n++; return n; }
function ctx(fy) {
  const D = DATA[fy], aT = D.asOfT, ad = new Date(aT), cm = fm(ad.getUTCMonth()), dd = ad.getUTCDate(), dim = daysIn(fy, cm);
  const closed = cm === 11 && dd === 31;
  return { asOfO: D.asOfO, lyUpto: closed ? 9999 : D.asOfO, asOfT: aT, cm, dd, dim, closed };
}

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e) { const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; }
function hideTip() { tip.hidden = true; }
const tr = (c, k, v) => `<div class="r"><span>${c ? `<i style="background:${c}"></i>` : ''}${k}</span><b style="margin:0">${v}</b></div>`;
function bindTips(root, fn) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('pointerenter', e => showTip(e, fn(el.dataset.tip)));
    el.addEventListener('pointermove', moveTip);
    el.addEventListener('pointerleave', hideTip);
  });
}

/* ---------- svg helpers ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return ([1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10].find(s => n <= s)) * p; }
function yAxis(W, H, pad, max, fmt, ticks = 4) {
  let s = ''; for (let i = 0; i <= ticks; i++) { const v = max * i / ticks, y = pad.t + (H - pad.t - pad.b) * (1 - i / ticks);
    s += `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; }
  return s;
}
const rbar = (x, y, w, h, fill, extra = '') => { if (h <= 0) return ''; const r = Math.min(3, w / 2, h); return `<path ${extra} fill="${fill}" d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z"/>`; };

function monthlyChart(fy, sel = null) {
  const pf = prevFY(fy), cur = byMonth(filt(fy)), prev = pf ? byMonth(filt(pf)) : null, T = tgt(fy), c = ctx(fy);
  const W = 720, H = 280, pad = { t: 12, r: 8, b: 26, l: 46 };
  const max = niceMax(L(Math.max(...cur, ...(prev || [0]), ...(T || [0]).map(x => x || 0))));
  const iw = (W - pad.l - pad.r) / 12, bw = Math.min(22, (iw - 10) / (prev ? 2 : 1)), sy = v => (H - pad.b) - (H - pad.t - pad.b) * (L(v) / max);
  let s = yAxis(W, H, pad, max, fAx);
  for (let m = 0; m < 12; m++) {
    const x0 = pad.l + iw * m, cx = x0 + iw / 2, gw = bw * (prev ? 2 : 1) + (prev ? 2 : 0), bx = cx - gw / 2;
    if (sel === m) s += `<rect x="${x0 + 2}" y="${pad.t}" width="${iw - 4}" height="${H - pad.t - pad.b}" rx="6" fill="var(--accent-bg)"/>`;
    if (prev) s += rbar(bx, sy(prev[m]), bw, (H - pad.b) - sy(prev[m]), FYCOL[pf]);
    const fx = prev ? bx + bw + 2 : bx;
    s += rbar(fx, sy(cur[m]), bw, (H - pad.b) - sy(cur[m]), FYCOL[fy]);
    if (T && T[m]) s += `<line x1="${bx - 4}" x2="${bx + gw + 4}" y1="${sy(T[m])}" y2="${sy(T[m])}" stroke="var(--tgt)" stroke-width="2" stroke-dasharray="4 2.5"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="${(sel == null ? m === c.cm && !c.closed : m === sel) ? 'lab' : ''}">${MON[m]}</text>`;
    s += `<rect data-tip="${m}" x="${x0}" y="${pad.t}" width="${iw}" height="${H - pad.t - pad.b}" fill="transparent"/>`;
  }
  s += `<line class="axis" x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}"/>`;
  const leg = `<div class="legend"><span><i style="background:${FYCOL[fy]}"></i>FY ${fy}</span>${prev ? `<span><i style="background:${FYCOL[pf]}"></i>FY ${pf}</span>` : ''}${T ? '<span><i class="dash"></i>ABP target</span>' : ''}<span class="muted">${chartUnit()}</span></div>`;
  return { html: leg + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly sales, FY ${fy}${prev ? ' vs ' + pf : ''}">${s}</svg>`,
    tip: k => { const m = +k; let h = `<b>${MON[m]} · FY ${fy}</b>` + tr(FYCOL[fy], 'Sales', fL(cur[m]));
      if (prev) h += tr(FYCOL[pf], 'FY ' + pf, fL(prev[m])) + tr('', 'Growth', fP(prev[m] ? (cur[m] / prev[m] - 1) * 100 : null));
      if (T && T[m]) h += tr('', 'Target', fL(T[m])) + tr('', 'Achieved', fP(pct(cur[m], T[m])));
      return h; } };
}

function cumChart(fy, sel = null) {
  const W = 720, H = 280, pad = { t: 12, r: 64, b: 26, l: 46 };
  const series = FYS.map(f => { const bm = byMonth(filt(f)), c = ctx(f); let a = 0; const last = f === fy || DATA[f].asOfO < 364 ? c.cm : 11; return { f, v: bm.map((x, i) => i <= last ? (a += x) : null) }; });
  const T = tgt(fy); let tc = null; if (T) { let a = 0; tc = T.map(x => (a += (x || 0))); }
  const max = niceMax(L(Math.max(...series.flatMap(s => s.v.filter(x => x != null)), ...(tc || [0]))));
  const iw = (W - pad.l - pad.r) / 11, sx = i => pad.l + iw * i, sy = v => (H - pad.b) - (H - pad.t - pad.b) * (L(v) / max);
  let s = yAxis(W, H, pad, max, fAx);
  if (sel != null) s += `<rect x="${pad.l}" y="${pad.t}" width="${sx(sel) - pad.l}" height="${H - pad.t - pad.b}" fill="var(--accent-bg)"/><line x1="${sx(sel)}" x2="${sx(sel)}" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--accent)" stroke-width="1.5"/>`;
  for (let m = 0; m < 12; m++) s += `<text x="${sx(m)}" y="${H - 8}" text-anchor="middle" class="${m === sel ? 'lab' : ''}">${MON[m]}</text>`;
  if (tc) s += `<polyline fill="none" stroke="var(--tgt)" stroke-width="1.5" stroke-dasharray="5 3" points="${tc.map((v, i) => sx(i) + ',' + sy(v)).join(' ')}"/>`;
  const labels = [];
  for (const se of series) {
    const pts = se.v.map((v, i) => v == null ? null : [sx(i), sy(v)]).filter(Boolean); if (!pts.length) continue;
    const w = se.f === fy ? 2.5 : 2;
    if (se.f === fy) s += `<polygon fill="${FYCOL[se.f]}" opacity=".10" points="${pts[0][0]},${H - pad.b} ${pts.map(p => p.join(',')).join(' ')} ${pts[pts.length - 1][0]},${H - pad.b}"/>`;
    s += `<polyline fill="none" stroke="${FYCOL[se.f]}" stroke-width="${w}" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    const lp = pts[pts.length - 1]; s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${FYCOL[se.f]}" stroke="var(--panel)" stroke-width="2"/>`;
    labels.push({ x: lp[0] + 8, y: lp[1] + 4, t: se.f + ' · ' + (UNIT === AC ? nf0.format(L(se.v[pts.length - 1])) + ' L' : fLn(se.v[pts.length - 1])) });
  }
  labels.sort((a, b) => a.y - b.y); for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 13) labels[i].y = labels[i - 1].y + 13;
  for (const l of labels) s += `<text x="${Math.min(l.x, W - pad.r + 4)}" y="${l.y}" class="lab">${l.t}</text>`;
  for (let m = 0; m < 12; m++) s += `<rect data-tip="${m}" x="${sx(m) - iw / 2}" y="${pad.t}" width="${iw}" height="${H - pad.t - pad.b}" fill="transparent"/>`;
  s += `<line class="axis" x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}"/>`;
  const leg = `<div class="legend">${FYS.map(f => `<span><i class="ln" style="background:${FYCOL[f]}"></i>FY ${f}</span>`).join('')}${tc ? `<span><i class="dash"></i>ABP ${fy}</span>` : ''}<span class="muted">${chartUnit()}, cumulative</span></div>`;
  return { html: leg + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative sales by financial year">${s}</svg>`,
    tip: k => { const m = +k; let h = `<b>Apr – ${MON[m]} cumulative</b>`; for (const se of series) if (se.v[m] != null) h += tr(FYCOL[se.f], 'FY ' + se.f, fL(se.v[m])); if (tc) h += tr('', 'ABP ' + fy, fL(tc[m])); return h; } };
}

function selM(fy) { const c = ctx(fy), m = S.dm; return (m == null || (!c.closed && m > c.cm)) ? c.cm : m; }
function mInfo(fy, m) { const c = ctx(fy), live = !c.closed && m === c.cm, dim = daysIn(fy, m); return { m, live, dim, upto: live ? c.dd : dim, y: +fy.slice(0, 4) + (m >= 9 ? 1 : 0) }; }
const mLabel = (fy, m) => MON[m] + ' ' + (+fy.slice(0, 4) + (m >= 9 ? 1 : 0));

function dailyChart(fy, m, hl = null) {
  const mi = mInfo(fy, m), rows = filt(fy).filter(r => r.m === m), dim = mi.dim, a = new Array(dim + 1).fill(0);
  for (const r of rows) a[r.dd] += r.amt;
  const T = tgt(fy), req = T && T[m] ? T[m] / workDays(fy, m, 1, dim) : null;
  const W = 1260, H = 250, pad = { t: 12, r: 8, b: 26, l: 46 };
  const max = niceMax(L(Math.max(...a, req || 0)));
  const iw = (W - pad.l - pad.r) / dim, bw = Math.max(3, iw - 4), sy = v => (H - pad.b) - (H - pad.t - pad.b) * (L(v) / max);
  const mo = (m + 3) % 12;
  let s = yAxis(W, H, pad, max, fAx, 4);
  for (let d = 1; d <= dim; d++) {
    const x = pad.l + iw * (d - 1) + (iw - bw) / 2, sun = new Date(Date.UTC(mi.y, mo, d)).getUTCDay() === 0;
    if (hl === d) s += `<rect x="${pad.l + iw * (d - 1)}" y="${pad.t}" width="${iw}" height="${H - pad.t - pad.b}" rx="4" fill="var(--accent-bg)" stroke="var(--accent-line)"/>`;
    s += rbar(x, sy(a[d]), bw, (H - pad.b) - sy(a[d]), FYCOL[fy]);
    if (d === 1 || d % 5 === 0 || d === dim) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${d}</text>`;
    if (sun) s += `<circle cx="${x + bw / 2}" cy="${H - pad.b + 5}" r="1.6" fill="var(--ink-3)"/>`;
    s += `<rect data-tip="${d}" x="${pad.l + iw * (d - 1)}" y="${pad.t}" width="${iw}" height="${H - pad.t - pad.b}" fill="transparent"/>`;
  }
  if (req) s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(req)}" y2="${sy(req)}" stroke="var(--tgt)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  s += `<line class="axis" x1="${pad.l}" x2="${W - pad.r}" y1="${H - pad.b}" y2="${H - pad.b}"/>`;
  const leg = `<div class="legend"><span><i style="background:${FYCOL[fy]}"></i>Daily sales</span>${req ? `<span><i class="dash"></i>Needed per working day (${fL(req)})</span>` : ''}<span class="muted">${chartUnit()} · dots mark Sundays</span></div>`;
  return { html: leg + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales, ${mLabel(fy, m)}">${s}</svg>`,
    tip: k => { const d = +k, inv = new Set(rows.filter(r => r.dd === d).map(r => r.inv)).size; return `<b>${d} ${MON[m]}</b>` + tr(FYCOL[fy], 'Sales', fL(a[d])) + tr('', 'Invoices', inv) + (req ? tr('', 'vs needed', fP(pct(a[d], req))) : ''); } };
}

/* ---------- views ---------- */
function kpis(fy) {
  const c = ctx(fy), pf = prevFY(fy), rows = filt(fy), tot = sum(rows), T = tgt(fy);
  const ly = pf ? sum(filt(pf, { upto: c.lyUpto })) : null;
  const annT = T ? T.reduce((a, b) => a + (b || 0), 0) : null;
  const ytdT = T ? T.slice(0, c.cm).reduce((a, b) => a + (b || 0), 0) + (T[c.cm] || 0) * (c.dd / c.dim) : null;
  const invs = new Set(rows.map(r => r.inv)).size, custs = new Set(rows.map(r => r.cust)).size, parts = new Set(rows.map(r => r.part)).size;
  const first = rows.length ? Math.min(...rows.map(r => r.t)) : null;
  return `<section class="tiles">
  <div class="tile hero"><span class="lbl">Sales · FY ${fy} to date</span><span class="val">${fLn(tot)}${uTag()}</span>
    <span class="foot">${fAlt(tot)} · ${first ? fD(first) + ' – ' + fD(c.asOfT) : 'no dispatches'}</span>
    ${annT ? `<div class="meter" title="Share of annual ABP"><i style="width:${Math.min(100, pct(tot, annT))}%"></i></div><span class="foot">${fP(pct(tot, annT))} of annual ABP ${fL(annT)}</span>` : ''}</div>
  <div class="tile"><span class="lbl">vs ABP to date</span><span class="val">${ytdT ? fP(pct(tot, ytdT)) : '–'}</span>
    <span class="foot">${ytdT ? `${tot >= ytdT ? '<span class="chip up">Ahead</span>' : '<span class="chip dn">Behind</span>'} Target ${fL(ytdT)} · ${tot >= ytdT ? 'ahead by' : 'short by'} ${fL(Math.abs(tot - ytdT))}` : '<span class="muted">' + (targetsOn() ? 'No target set for this year' : 'Targets apply when All customers is selected') + '</span>'}</span></div>
  <div class="tile"><span class="lbl">vs last year, same period</span><span class="val" style="color:${ly ? (tot >= ly ? 'var(--good)' : 'var(--bad)') : 'inherit'}">${ly ? (tot >= ly ? '+' : '') + fP((tot / ly - 1) * 100) : '–'}</span>
    <span class="foot">${ly ? `FY ${pf}: ${fL(ly)} · ${tot >= ly ? '+' : '−'}${fL(Math.abs(tot - ly))}` : '<span class="muted">No earlier year loaded</span>'}</span></div>
  ${qtyTile('Sales qty · FY to date', rows, pf ? filt(pf, { upto: c.lyUpto }) : null, 'vs same period LY', qtPro(fy, c.cm, c.dd / c.dim), 'target to date')}
  </section>`;
}
const qtyOf = rows => rows.reduce((a, r) => a + (r.pc === 'Scrap' ? 0 : r.qty), 0);
function qtyTile(lbl, rows, lyRows, lyTxt, qT = null, qTxt = 'target') {
  const q = qtyOf(rows), lq = lyRows ? qtyOf(lyRows) : null;
  return `<div class="tile"><span class="lbl">${lbl}</span><span class="val">${fQ(q)}<small>Nos</small></span>
    ${qT ? `<span class="foot">${chipA(pct(q, qT))} of ${qTxt} ${fQ(Math.round(qT))}</span><div class="meter"><i style="width:${Math.min(100, pct(q, qT))}%"></i></div>` : ''}
    <span class="foot">${lq ? chipG((q / lq - 1) * 100) + ' ' + lyTxt + ' (' + fQ(lq) + ')' : '<span class="muted">No earlier year loaded</span>'}</span>
    <span class="foot muted">Excludes scrap (weight)</span></div>`;
}

function monthKpis(fy, m) {
  const mi = mInfo(fy, m), pf = prevFY(fy), T = tgt(fy), rows = filt(fy).filter(r => r.m === m), tot = sum(rows), mT = T ? T[m] : null;
  const lyRows = pf ? filt(pf).filter(r => r.m === m && (!mi.live || r.dd <= mi.upto)) : null, ly = lyRows ? sum(lyRows) : null;
  const lyFull = pf ? sum(filt(pf).filter(r => r.m === m)) : null;
  const days = new Set(rows.map(r => r.dd)).size, avg = days ? tot / days : 0;
  const remWD = mi.live ? workDays(fy, m, mi.upto + 1, mi.dim) : 0, ask = mi.live && mT && remWD ? Math.max(0, mT - tot) / remWD : null;
  const byDay = new Array(mi.dim + 1).fill(0); rows.forEach(r => byDay[r.dd] += r.amt); let best = 0; for (let d = 1; d <= mi.dim; d++) if (byDay[d] > byDay[best]) best = d;
  const invs = new Set(rows.map(r => r.inv)).size, custs = new Set(rows.map(r => r.cust)).size;
  const lyLbl = mi.live ? `${MON[m]} 1–${mi.upto}, FY ${pf}` : `${MON[m]}, FY ${pf}`;
  return `<section class="tiles">
  <div class="tile hero"><span class="lbl">${mLabel(fy, m)} · ${mi.live ? 'month to date' : 'full month'}</span><span class="val">${fLn(tot)}${uTag()}</span>
    <span class="foot">${fAlt(tot)} · ${mi.live ? 'up to ' + mi.upto + ' ' + MON[m] : days + ' dispatch days'}</span>
    ${mT ? `<div class="meter"><i style="width:${Math.min(100, pct(tot, mT))}%"></i></div>` : ''}</div>
  <div class="tile"><span class="lbl">vs month target</span><span class="val">${mT ? fP(pct(tot, mT)) : '–'}</span>
    <span class="foot">${mT ? `${tot >= mT ? '<span class="chip up">Met</span>' : mi.live ? '<span class="chip mid">In progress</span>' : '<span class="chip dn">Missed</span>'} Target ${fL(mT)} · ${tot >= mT ? 'over by' : 'short by'} ${fL(Math.abs(tot - mT))}` : '<span class="muted">No target for this month</span>'}</span></div>
  <div class="tile"><span class="lbl">vs last year</span><span class="val" style="color:${ly ? (tot >= ly ? 'var(--good)' : 'var(--bad)') : 'inherit'}">${ly ? (tot >= ly ? '+' : '') + fP((tot / ly - 1) * 100) : '–'}</span>
    <span class="foot">${ly ? `${lyLbl}: ${fL(ly)}${mi.live ? ' · full month ' + fL(lyFull) : ''}` : '<span class="muted">No earlier year loaded</span>'}</span></div>
  ${mi.live ? `<div class="tile"><span class="lbl">Asking rate</span><span class="val">${ask != null ? fLn(ask) + uTag('/day') : '–'}</span>
    <span class="foot">${ask != null ? `${remWD} working days left · running at ${fL(avg)}/day` : mT && tot >= mT ? 'Month target met' : `Avg ${fL(avg)} per dispatch day`}</span></div>`
  : `<div class="tile"><span class="lbl">Daily average</span><span class="val">${fLn(avg)}${uTag('/day')}</span>
    <span class="foot">${best ? `Best day ${best} ${MON[m]}: ${fL(byDay[best])}` : 'No dispatches'}</span></div>`}
  ${qtyTile('Sales qty · ' + MON[m], rows, lyRows, mi.live ? 'vs same days LY' : 'vs ' + MON[m] + ' LY', qtgt(fy) ? qtgt(fy)[m] : null, 'month target')}
  </section>`;
}

function cumTiles(fy, m) {
  const mi = mInfo(fy, m), pf = prevFY(fy), T = tgt(fy);
  const rows = filt(fy).filter(r => r.m <= m), tot = sum(rows);
  const lyRows = pf ? filt(pf).filter(r => r.m < m || (r.m === m && (!mi.live || r.dd <= mi.upto))) : null, ly = lyRows ? sum(lyRows) : null;

function catTable(fy, key, label, limit = 12, m = null) {
  const c = ctx(fy), pf = prevFY(fy), mi = m == null ? null : mInfo(fy, m), o = key === 'cc' ? { noCC: true } : {};

  const lyR = !pf ? [] : m == null ? filt(pf, Object.assign({ upto: c.lyUpto }, o)) : filt(pf, o).filter(r => r.m === m && (!mi.live || r.dd <= mi.upto));

  const shown = list.slice(0, limit), rest = list.slice(limit);

}

/* ---------- date view ---------- */
const o2iso = (fy, o) => new Date(fyStart(fy) + o * 864e5).toISOString().slice(0, 10);
const iso2o = (fy, s) => { const t = Date.parse(s + 'T00:00:00Z'); return isNaN(t) ? null : Math.round((t - fyStart(fy)) / 864e5); };
const oT = (fy, o) => fyStart(fy) + o * 864e5;
function lyO(fy, o) { const pf = prevFY(fy); if (!pf) return null; const d = new Date(oT(fy, o)); let t = Date.UTC(d.getUTCFullYear() - 1, d.getUTCMonth(), d.getUTCDate()); if (new Date(t).getUTCMonth() !== d.getUTCMonth()) t -= 864e5; return Math.round((t - fyStart(pf)) / 864e5); }
function dayTarget(fy, o, T = tgt(fy)) { if (!T) return null; const d = new Date(oT(fy, o)); if (d.getUTCDay() === 0) return 0; const m = fm(d.getUTCMonth()); return T[m] ? T[m] / workDays(fy, m, 1, daysIn(fy, m)) : 0; }
function rangeTarget(fy, a, b, T = tgt(fy)) { if (!T) return null; let s = 0; for (let o = a; o <= b; o++) s += dayTarget(fy, o, T); return s; }
const dLabel = (fy, a, b) => a === b ? fD(oT(fy, a)) : fD(oT(fy, a)) + ' – ' + fD(oT(fy, b));
function dSpec(fy, a, b) { return { pred: r => r.o >= a && r.o <= b, label: dLabel(fy, a, b), fname: `PMI_sales_${o2iso(fy, a)}${a === b ? '' : '_to_' + o2iso(fy, b)}.xlsx` }; }
function mSpec(fy, m) { return { pred: r => r.m === m, label: mLabel(fy, m), fname: `PMI_sales_${MON[m]}_${mInfo(fy, m).y}.xlsx` }; }

function dateTiles(fy, a, b) {
  const pf = prevFY(fy), rows = filt(fy).filter(r => r.o >= a && r.o <= b), tot = sum(rows), tg = rangeTarget(fy, a, b);
  const la = lyO(fy, a), lb = lyO(fy, b), lyRows = pf ? filt(pf).filter(r => r.o >= la && r.o <= lb) : null, ly = lyRows ? sum(lyRows) : null;
  const one = a === b, days = new Set(rows.map(r => r.o)).size, invs = new Set(rows.map(r => r.inv)).size, custs = new Set(rows.map(r => r.cust)).size;
  return `<section class="tiles">
  <div class="tile hero"><span class="lbl">Sales · ${dLabel(fy, a, b)}</span><span class="val">${fLn(tot)}${uTag()}</span>
    <span class="foot">${fAlt(tot)} · ${one ? new Date(oT(fy, a)).toLocaleDateString('en-IN', { weekday: 'long', timeZone: 'UTC' }) : (b - a + 1) + ' days, ' + days + ' with dispatch'}</span></div>
  <div class="tile"><span class="lbl">vs ${one ? 'daily' : 'period'} target</span><span class="val">${tg ? fP(pct(tot, tg)) : '–'}</span>
    <span class="foot">${tg ? `${tot >= tg ? '<span class="chip up">Above</span>' : '<span class="chip dn">Below</span>'} Needed ${fL(tg)} · ${tot >= tg ? 'over by' : 'short by'} ${fL(Math.abs(tot - tg))}` : tg === 0 ? '<span class="muted">Sunday · no target</span>' : '<span class="muted">No target</span>'}</span></div>

    <span class="foot">${pf ? `${dLabel(pf, la, lb)}: ${fL(ly || 0)}` : '<span class="muted">No earlier year loaded</span>'}</span></div>
  ${qtyTile('Sales qty', rows, lyRows, 'vs LY', rangeTarget(fy, a, b, qtgt(fy)), a === b ? 'daily target' : 'period target')}
  <div class="tile"><span class="lbl">Invoices · customers</span><span class="val">${fQ(invs)}</span><span class="foot">${custs} customers · ${fQ(rows.length)} lines</span></div>

function dateCum(fy, b) {

  const lb = lyO(fy, b), lyY = pf ? sum(filt(pf).filter(r => r.o <= lb)) : null;

  return `<div class="sec-hd" style="padding-top:6px;margin-top:0"><div><div class="eyebrow">Cumulative up to ${fD(oT(fy, b))}</div><h2 style="font-size:16px">Month to date and year to date</h2></div></div>
  <section class="tiles">

    <span class="foot">${mT ? chipA(pct(mtdV, mT)) + ' of pro-rata ' + fL(mT) : ''}${lyM ? ' ' + chipG((mtdV / lyM - 1) * 100) + ' vs LY' : ''}</span>${T && T[m] ? `<div class="meter"><i style="width:${Math.min(100, pct(mtdV, T[m]))}%"></i></div><span class="foot muted">${fP(pct(mtdV, T[m]))} of full-month target ${fL(T[m])}</span>` : ''}</div>
  <div class="tile hero"><span class="lbl">Apr 1 – ${dd} ${MON[m]} (YTD)</span><span class="val">${fLn(ytdV)}${uTag()}</span>
    <span class="foot">${fAlt(ytdV)}${annT ? ' · ' + fP(pct(ytdV, annT)) + ' of annual ABP' : ''}</span>${annT ? `<div class="meter"><i style="width:${Math.min(100, pct(ytdV, annT))}%"></i></div>` : ''}</div>
  <div class="tile"><span class="lbl">YTD vs target</span><span class="val">${yT ? fP(pct(ytdV, yT)) : '–'}</span>
    <span class="foot">${yT ? `${ytdV >= yT ? '<span class="chip up">Ahead</span>' : '<span class="chip dn">Behind</span>'} Target ${fL(yT)} · ${ytdV >= yT ? 'ahead by' : 'short by'} ${fL(Math.abs(ytdV - yT))}` : '<span class="muted">No target</span>'}</span></div>
  <div class="tile"><span class="lbl">YTD vs last year</span><span class="val" style="color:${lyY ? (ytdV >= lyY ? 'var(--good)' : 'var(--bad)') : 'inherit'}">${lyY ? (ytdV >= lyY ? '+' : '') + fP((ytdV / lyY - 1) * 100) : '–'}</span>
    <span class="foot">${lyY ? `FY ${pf}: ${fL(lyY)}` : '<span class="muted">No earlier year loaded</span>'}</span></div>
  ${qtyTile('YTD qty', ytd, pf ? filt(pf).filter(r => r.o <= lb) : null, 'vs LY', qtPro(fy, m, dd / dim), 'target to date')}

}
function rangeChart(fy, a, b) {

async function restoreBackup(txt, name) {

/* ---------- shared store ---------- */
let DB = null, CAN_EDIT = false, MY_ID = null, MY_NAME = '', USER = null; const LOADED_VER = {};
async function loadUpload(meta) {

  const parts = []; for (let i = 0; i < meta.chunks; i++) { const s = await DB.doc(`chunks/fy-${fy}-${i}`).get(); const d = s.exists && s.data(); if (!d || d.ver !== meta.ver) return; parts.push(typeof d.pack === 'string' ? JSON.parse(d.pack) : d.pack); }
  const rows = parts.flatMap(p => decode(fy, p)); LOADED_VER[fy] = meta.ver;
  let byName = meta.byName || ''; try { if (meta.by && USER) { const ps = await USER.profiles([meta.by]); byName = (ps[meta.by] && ps[meta.by].name) || ''; } } catch (e) {}
  setFY(fy, rows, { kind: 'uploaded', file: meta.file, at: meta.at, byName }); refreshAll();
}
async function initStore() {

  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  USER = user; if (user) { try { CAN_EDIT = await user.canEdit(); MY_ID = await user.id(); MY_NAME = (await user.name()) || ''; } catch (e) {} }
  if (!db) { AUTH_READY = true; setPill(); refreshAll(); return; }
  DB = db; setPill();
  const authTimer = setTimeout(() => { if (!AUTH_READY) { AUTH_READY = true; refreshAll(); } }, 6000);
  db.doc('settings/auth').onSnapshot(s => { AUTH = s.exists ? s.data() : { users: [] }; restoreLogin(); const first = !AUTH_READY; AUTH_READY = true; clearTimeout(authTimer); refreshAll(!first); }, () => { AUTH_READY = true; refreshAll(); });
  subscribeData(db);
}
function subscribeData(db) {
  const un = [];
  un.push(db.doc('settings/targets').onSnapshot(s => { if (!s.exists) return; const d = s.data(); for (const fy of FYS) { const a = d['fy' + fy.replace('-', '_')]; if (Array.isArray(a) && a.length === 12) TARGETS[fy] = a.slice(); const q = d['qfy' + fy.replace('-', '_')]; if (Array.isArray(q) && q.length === 12) QTGT[fy] = q.slice(); const ab = d['abp' + fy.replace('-', '_')]; if (Array.isArray(ab) && ab.length === 12) ABP[fy] = ab.slice(); } refreshAll(true); }, () => {}));
  un.push(db.collection('uploads').onSnapshot(async snap => {
    const seen = new Set();
    for (const doc of snap.docs) { const m = doc.data(); seen.add(m.fy); try { await loadUpload(m); } catch (e) {} }
    for (const fy of FYS) if (!seen.has(fy) && DATA[fy].meta.kind === 'uploaded' && LOADED_VER[fy]) { delete LOADED_VER[fy]; setFY(fy, decode(fy, SEED[fy]), { kind: 'built-in', src: SEED[fy].src }); refreshAll(); }

/* ---------- downloads ---------- */
async function download(name, rows, raw, sheetName) {
  if (/\.xlsx$/i.test(name) && rows) {
    if (!window.XLSX) { toast('The Excel writer did not load. Check your connection and reload.'); return; }
    const conv = rows.map((r, i) => i === 0 ? r : r.map(v => typeof v === 'string' && v !== '' && /^-?\d+(\.\d+)?$/.test(v) ? +v : v));
    const ws = XLSX.utils.aoa_to_sheet(conv);
    ws['!cols'] = conv[0].map((h, c) => ({ wch: Math.min(60, Math.max(String(h).length, ...conv.slice(1, 200).map(r => String(r[c] ?? '').length)) + 2) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, (sheetName || 'Data').slice(0, 31));
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' }), blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const dlx = window.claude && window.claude.use ? await claude.use('downloads') : null;
    if (dlx) { try { await dlx.save({ filename: name, data: blob }); toast('Saved ' + name); } catch (e) { if (e && e.code !== 'declined') toast('Could not save the file (' + (e.code || 'error') + ').'); } return; }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Saved ' + name); } catch (e) { toast('Downloads are not available in this view.'); }
    return;
  }
  const csv = raw != null ? raw : rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const dl = window.claude && window.claude.use ? await claude.use('downloads') : null;
  if (!dl) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([(raw != null ? '' : '\ufeff') + csv], { type: raw != null ? 'application/json' : 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Saved ' + name); } catch (e) { toast('Downloads are not available in this view.'); } return; }
  try { await dl.save({ filename: name, data: (raw != null ? '' : '\ufeff') + csv }); toast('Saved ' + name); } catch (e) { if (e && e.code !== 'declined') toast('Could not save the file (' + (e.code || 'error') + ').'); }
}

function toast(t) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'msg'; el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.18)'; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 3500); }

const TILE_IC = {
